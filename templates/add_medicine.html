<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Medicine - Pharmacy Inventory System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.page-container{max-width:900px;margin:35px auto;padding:0 20px}
.form-card{background:white;border-radius:18px;padding:40px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.form-title{text-align:center;font-size:32px;margin-bottom:10px;color:#1e293b}
.form-subtitle{text-align:center;color:#64748b;margin-bottom:35px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.form-group{display:flex;flex-direction:column}
.form-group.full-width{grid-column:1/-1}
.form-group label{font-weight:600;margin-bottom:8px;color:#334155}
.form-group input,.form-group select{width:100%;padding:13px 15px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;outline:none;background:white}
.form-group input:focus,.form-group select:focus{border-color:#2684ed;box-shadow:0 0 0 3px rgba(38,132,237,.12)}
.form-actions{display:flex;justify-content:center;gap:15px;margin-top:35px}
.submit-button{border:none;padding:14px 30px;border-radius:8px;background:linear-gradient(135deg,#2684ed,#1769d1);color:white;font-size:17px;font-weight:bold;cursor:pointer}
.submit-button:hover{transform:translateY(-2px);box-shadow:0 6px 15px rgba(23,105,209,.25)}
.back-button{display:inline-flex;align-items:center;justify-content:center;padding:14px 30px;border-radius:8px;background:#64748b;color:white;text-decoration:none;font-size:17px;font-weight:bold}
.back-button:hover{color:white;background:#475569}
.required{color:#dc2626}
@media(max-width:700px){.form-card{padding:25px}.form-grid{grid-template-columns:1fr}.form-group.full-width{grid-column:auto}.form-actions{flex-direction:column}.submit-button,.back-button{width:100%}}
</style>
</head>
<body>

<header class="header">
<div class="header-content">
<div class="logo-icon">💊</div>
<div>
<h1>Pharmacy Inventory System</h1>
<p>Manage medicines, stock and expiry dates</p>
</div>
</div>
</header>

<main class="page-container">
<div class="form-card">
<h2 class="form-title">Add New Medicine</h2>
<p class="form-subtitle">Enter the medicine details below to add it to the inventory.</p>

<form method="POST">
<div class="form-grid">

<div class="form-group">
<label for="name">Medicine Name <span class="required">*</span></label>
<input type="text" id="name" name="name" placeholder="Enter medicine name" required>
</div>

<div class="form-group">
<label for="category">Category <span class="required">*</span></label>
<input type="text" id="category" name="category" placeholder="e.g. Painkiller" required>
</div>

<div class="form-group">
<label for="manufacturer">Manufacturer</label>
<input type="text" id="manufacturer" name="manufacturer" placeholder="Enter manufacturer name">
</div>

<div class="form-group">
<label for="batch_number">Batch Number</label>
<input type="text" id="batch_number" name="batch_number" placeholder="Enter batch number">
</div>

<div class="form-group">
<label for="quantity">Quantity <span class="required">*</span></label>
<input type="number" id="quantity" name="quantity" placeholder="Enter quantity" min="0" required>
</div>

<div class="form-group">
<label for="price">Price (₹) <span class="required">*</span></label>
<input type="number" id="price" name="price" placeholder="Enter price" min="0" step="0.01" required>
</div>

<div class="form-group full-width">
<label for="expiry_date">Expiry Date <span class="required">*</span></label>
<input type="date" id="expiry_date" name="expiry_date" required>
</div>

</div>

<div class="form-actions">
<button type="submit" class="submit-button">➕ Add Medicine</button>
<a href="/" class="back-button">← Back to Dashboard</a>
</div>
</form>
</div>
</main>

<footer class="footer">
<p>© 2026 Pharmacy Inventory System | Keep Medicines Safe</p>
</footer>

</body>
</html>
